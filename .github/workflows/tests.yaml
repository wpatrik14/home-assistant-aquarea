name: Run tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          # 3.14, not the 3.12 minimum: the tests exec single functions
          # extracted via AST without their module's imports, which only
          # works with 3.14's lazily evaluated annotations (PEP 649).
          python-version: "3.14"
      # The tests are stdlib-only scripts, so nothing to install. Each one
      # exits non-zero on failure; run them all, then fail if any did.
      - name: Run tests
        run: |
          status=0
          for test in tests/test_*.py; do
            echo "::group::$test"
            if ! python "$test"; then
              status=1
              echo "::error file=$test::$test failed"
            fi
            echo "::endgroup::"
          done
          exit "$status"

  # The pytest suite in tests/ha/, on Home Assistant's own test harness
  # (pytest-homeassistant-custom-component). It runs next to the stdlib
  # scripts above, against the Home Assistant version pinned in
  # requirements_test.txt.
  pytest:
    name: pytest
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements_test.txt"
      - name: Install Home Assistant's test harness
        run: pip install -r requirements_test.txt
      - name: Run pytest
        run: pytest
      # Home Assistant's Bronze quality rule asks for full test coverage of
      # the config flow. pytest has written .coverage; check that file alone.
      - name: Require 100% coverage of config_flow.py
        run: coverage report --include=custom_components/aquarea/config_flow.py --fail-under=100
