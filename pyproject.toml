[tool.mypy]
python_version = "3.14"
warn_unused_ignores = true

# aioaquarea ships no py.typed marker, so its symbols are untyped for mypy.
# Scoped to the one module rather than set globally, so a genuinely missing
# dependency still fails loudly.
[[tool.mypy.overrides]]
module = "aioaquarea.*"
ignore_missing_imports = true

# pytest suite in tests/ha/, run with pytest-homeassistant-custom-component
# (requirements_test.txt). The stdlib scripts directly in tests/ are not pytest
# modules: each one is run as `python tests/test_<name>.py` and builds its own
# stand-ins (a few replace modules in sys.modules), so pytest must not collect
# them.
[tool.pytest.ini_options]
testpaths = ["tests/ha"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=custom_components/aquarea --cov-report=term-missing"

[tool.coverage.report]
# Overall floor for tests/ha/: raise it when coverage goes up, never lower it.
# CI additionally requires 100% for config_flow.py (the Bronze
# config-flow-test-coverage rule), via `coverage report --include=...`.
fail_under = 69
show_missing = true

[tool.ruff]
